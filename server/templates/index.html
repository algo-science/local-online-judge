<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Online Judge</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>

    <!-- Prism for static highlighting in list -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --light: #ecf0f1;
            --bg-body: #f5f6fa;
            --bg-container: white;
            --text-main: #333;
            --text-secondary: #34495e;
            --border: #ddd;
            --item-hover: #f5f5f5;
            --item-bg: #f9f9f9;
            --nav-text: white;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #1a1a1a;
            --secondary: #ecf0f1;
            --accent: #3498db;
            --light: #2c3e50;
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-secondary: #ecf0f1;
            --border: #444;
            --item-hover: #2c2c2c;
            --item-bg: #252525;
            --nav-text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        nav {
            background: var(--primary);
            color: var(--nav-text);
            padding: 0 1rem;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav .logo {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        nav .links {
            display: flex;
            align-items: center;
        }

        nav a {
            color: var(--nav-text);
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-container);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .nested-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nested-menu li {
            margin: 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: background 0.2s;
            user-select: none;
        }

        .menu-item:hover {
            background: var(--item-hover);
            color: var(--accent);
        }

        .menu-item.active {
            background: var(--item-bg);
            color: var(--accent);
            border-left: 3px solid var(--accent);
            font-weight: 600;
        }

        .menu-item .icon {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .menu-item .toggle {
            margin-left: auto;
            font-size: 0.8rem;
            transform: rotate(-90deg);
            transition: transform 0.2s;
        }

        .menu-item.expanded .toggle {
            transform: rotate(0deg);
        }

        .submenu {
            display: none;
            padding-left: 15px;
            background: rgba(0, 0, 0, 0.02);
        }

        .submenu.open {
            display: block;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: var(--bg-container);
            position: relative;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1,
        h2,
        h3 {
            color: var(--text-secondary);
        }

        /* Feature rich styles */
        .problem-header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .description code {
            background: var(--item-bg);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
            border: 1px solid var(--border);
        }

        .description pre {
            background: var(--item-bg);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        .code-editor {
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .CodeMirror {
            height: 500px;
            font-size: 14px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: var(--secondary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-link {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            color: var(--text-secondary);
            opacity: 0.7;
            transition: all 0.2s;
        }

        .tab-link:hover {
            opacity: 1;
            color: var(--accent);
        }

        .tab-link.active {
            border-bottom-color: var(--accent);
            opacity: 1;
            color: var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status Badges */
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-solved {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .badge-unsolved {
            background: #f5f5f5;
            color: #757575;
        }

        /* Modal & Utils */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--bg-container);
            margin: 10% auto;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Document/Theory Layout */
        .theory-doc {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .theory-doc h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .theory-doc h2 {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-top: 40px;
        }

        .theory-doc blockquote {
            border-left: 4px solid var(--accent);
            margin: 0;
            padding-left: 20px;
            color: var(--text-secondary);
            font-style: italic;
            background: var(--item-bg);
            padding: 15px;
            border-radius: 0 5px 5px 0;
        }

        /* Search Box in Sidebar */
        .search-box {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--item-bg);
            color: var(--text-main);
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 id="modal-title" style="margin:0;">Title</h3>
                <span onclick="closeModal()" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <div id="modal-body">
                <input type="text" id="modal-input"
                    style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;">
            </div>
            <div style="text-align:right;">
                <button class="secondary" onclick="closeModal()">Cancel</button>
                <button id="modal-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="logo">
            <i class="fas fa-cube" style="margin-right: 10px; color: var(--accent);"></i>
            AlgoScience
        </div>
        <div class="links">
            <a onclick="navigate('home')">Home</a>
            <a onclick="navigate('editor')">Playground</a>
            <i class="fas fa-moon" onclick="toggleTheme()" id="theme-icon" style="margin-left: 20px; cursor: pointer;"
                title="Toggle Dark Mode"></i>
        </div>
    </nav>

    <div class="main-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" placeholder="Search problems..." id="sidebar-search" oninput="filterSidebar()">
            </div>
            <div id="sidebar-content">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-area" id="app">
            <!-- Views injected here -->
            <div class="container" style="text-align: center; margin-top: 100px; color: var(--text-secondary);">
                <i class="fas fa-code" style="font-size: 4rem; opacity: 0.2; margin-bottom: 20px;"></i>
                <h2>Select a problem from the sidebar to begin</h2>
            </div>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        let allProblems = [];
        let problemGroups = {};

        async function init() {
            await loadProblems();
            renderSidebar();

            // Check hash for direct navigation
            const hash = window.location.hash.substring(1); // remove #
            if (hash.startsWith('problem?id=')) {
                const id = hash.split('=')[1];
                renderProblem(id);
            }
        }

        async function loadProblems() {
            try {
                const res = await fetch('/api/problems');
                // Backend returns: { "Group__SubGroup": { "problems": [...], "docs": "..." }, ... }
                const data = await res.json();
                problemGroups = data;
            } catch (e) {
                console.error(e);
            }
        }

        // --- Sidebar Rendering with Nested Support ---

        function renderSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = `<ul class="nested-menu" id="root-menu"></ul>`;
            const rootMenu = document.getElementById('root-menu');

            // Logic:
            // We receive keys like "Algorithms__Recursion__Contribution_Technique"
            // We want to transform this into a nested object structure first, then render.

            const tree = {};

            Object.keys(problemGroups).forEach(groupKey => {
                const parts = groupKey.split('__'); // Split by double underscore
                let currentLevel = tree;

                parts.forEach((part, index) => {
                    if (!currentLevel[part]) {
                        currentLevel[part] = {
                            _name: part,
                            _children: {},
                            _problems: [],
                            _docs: null,
                            _fullKey: null
                        };
                    }

                    // If it's the leaf node (the actual group from backend), attach data
                    if (index === parts.length - 1) {
                        currentLevel[part]._problems = problemGroups[groupKey].problems;
                        currentLevel[part]._docs = problemGroups[groupKey].docs;
                        currentLevel[part]._fullKey = groupKey;
                    }
                    currentLevel = currentLevel[part]._children;
                });
            });

            // Recursive renderer
            function buildMenuHtml(node, containerEl) {
                console.log('Building menu for node:', node); // Debug
                const keys = Object.keys(node);
                if (keys.length === 0) return;

                keys.forEach(key => {
                    const item = node[key];
                    const countChildren = Object.keys(item._children).length;
                    const countProblems = item._problems.length;

                    const hasSubFolders = countChildren > 0;
                    const hasProblems = countProblems > 0;

                    // Explicit expansion logic:
                    // Expandable if it has sub-folders OR problems
                    const canExpand = hasSubFolders || hasProblems;

                    console.log(`Item: ${item._name}, SubFolders: ${countChildren}, Problems: ${countProblems}, CanExpand: ${canExpand}`);

                    const li = document.createElement('li');

                    // Folder Header
                    const div = document.createElement('div');
                    div.className = 'menu-item';

                    // Visuals: If it can expand, show folder icon.
                    // If expanded, show open folder.
                    // If it's a leaf specifically (only problems), maybe show a different icon?
                    // For now, keep folder icons.

                    div.innerHTML = `
                        <span class="icon"><i class="fas ${hasSubFolders ? 'fa-folder' : 'fa-folder-open'}"></i></span>
                        ${item._name.replace(/_/g, ' ')} 
                        ${canExpand ? '<span class="toggle"><i class="fas fa-chevron-down"></i></span>' : ''}
                    `;

                    // Click behavior
                    div.onclick = (e) => {
                        if (canExpand) {
                            console.log('Toggling:', item._name);
                            div.classList.toggle('expanded');
                            const sub = li.querySelector('.submenu');
                            if (sub) sub.classList.toggle('open');
                        } else {
                            console.log('Cannot expand:', item._name);
                        }
                    };

                    li.appendChild(div);

                    // Container for Children + Problems
                    const subUl = document.createElement('ul');
                    subUl.className = 'submenu nested-menu';

                    // 1. Recursive Children
                    buildMenuHtml(item._children, subUl);

                    // 2. Problems
                    if (hasProblems) {
                        item._problems.forEach(p => {
                            const probLi = document.createElement('li');
                            probLi.innerHTML = `
                                <div class="menu-item" onclick="renderProblem('${p.id}')" style="padding-left: 30px; font-size: 0.9rem;">
                                    <span class="icon"><i class="${p.status === 'Solved' ? 'fas fa-check-circle' : 'far fa-circle'}" style="color: ${p.status === 'Solved' ? 'green' : '#ccc'}"></i></span>
                                    ${p.title}
                                </div>
                            `;
                            subUl.appendChild(probLi);
                        });
                    }

                    if (subUl.hasChildNodes()) {
                        li.appendChild(subUl);
                    }

                    containerEl.appendChild(li);
                });
            }

            console.log('Rendering Sidebar v3 (Fix Applied)');
            buildMenuHtml(tree, rootMenu);
        }

        // --- Views ---

        function renderDocs(markdown, title) {
            app.innerHTML = `
            <div class="theory-doc animated fadeIn">
                ${marked.parse(markdown)}
            </div>
        `;
            // Trigger MathJax
            if (window.MathJax) MathJax.typesetPromise();
        }

        async function renderProblem(id) {
            window.location.hash = `problem?id=${id}`;
            app.innerHTML = '<div style="text-align:center; padding:50px;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
            try {
                const res = await fetch(`/api/problems/${id}`);
                const problem = await res.json();

                // Submissions
                const subRes = await fetch(`/api/submissions/${id}`);
                const submissions = await subRes.json();
                let subHtml = submissions.map(s => `
                <div style="padding:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
                    <span style="color:${s.status === 'Accepted' ? 'green' : 'red'}; font-weight:bold;">${s.status}</span>
                    <span style="font-size:0.8rem; color:#888;">${new Date(s.timestamp).toLocaleString()}</span>
                </div>
            `).join('');

                app.innerHTML = `
                <div class="container animated fadeIn">
                    <div class="problem-header">
                        <div>
                            <h1 style="margin:0 0 10px 0;">${problem.title}</h1>
                            <div style="display:flex; gap:10px;">
                                <span class="badge ${problem.status === 'Solved' ? 'badge-solved' : 'badge-unsolved'}">${problem.id}</span>
                                <span class="badge badge-unsolved">${problem.rating || 'Unrated'}</span>
                            </div>
                        </div>
                        <div>
                           <i class="favorite-btn ${problem.is_favorite ? 'fas' : 'far'} fa-star fa-lg" style="color:#f1c40f; cursor:pointer;" onclick="toggleFavorite('${id}')"></i>
                        </div>
                    </div>

                    <div class="tabs">
                        <div class="tab-link active" onclick="switchTab(event, 'desc')">Description</div>
                        <div class="tab-link" onclick="switchTab(event, 'editorial')">Editorial</div>
                        <div class="tab-link" onclick="switchTab(event, 'subs')">Submissions (${submissions.length})</div>
                    </div>

                    <div id="desc" class="tab-content active">
                        <div class="description">${marked.parse(problem.description)}</div>
                        
                         <h3 style="margin-top:30px;">Editor</h3>
                         <div style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                             <div style="display:flex; gap: 10px; align-items:center;">
                                <select id="lang-select" style="padding:5px;" onchange="changeLanguage()">
                                    <option value="python">Python 3</option>
                                    <option value="cpp">C++</option>
                                    <option value="java">Java</option>
                                </select>
                                <button class="secondary" onclick="resetCode('${id}')" title="Reset to template"><i class="fas fa-undo"></i></button>
                                <span id="save-status" style="font-size:0.8rem; color:#888; margin-left:10px;"><i class="fas fa-check"></i> Saved</span>
                             </div>
                             <div>
                                <button class="secondary" onclick="runCode('${id}')" style="margin-right:10px;"><i class="fas fa-play"></i> Run Code</button>
                                <button onclick="submitCode('${id}')"><i class="fas fa-paper-plane"></i> Submit</button>
                             </div>
                         </div>
                         <div class="code-editor">
                             <textarea id="code-area"></textarea>
                         </div>
                         <div id="result-area" style="margin-top:20px;"></div>
                    </div>

                    <div id="editorial" class="tab-content">
                        <div class="description">
                            ${problem.editorial ? marked.parse(problem.editorial) : '<p>No editorial available.</p>'}
                        </div>
                    </div>

                    <div id="subs" class="tab-content">
                        ${subHtml || '<p>No submissions yet.</p>'}
                    </div>
                </div>
            `;

                initEditor();
                if (window.MathJax) MathJax.typesetPromise();

            } catch (e) {
                app.innerHTML = `<p style="color:red">Error loading problem: ${e.message}</p>`;
            }
        }

        // --- Editor & Submission ---
        let editorInstance;

        const languageTemplates = {
            'python': "import sys\n\ndef solve():\n    # Write your solution here\n    pass\n\nif __name__ == '__main__':\n    solve()",
            'cpp': "#include <iostream>\n#include <vector>\n#include <algorithm>\n\nusing namespace std;\n\nvoid solve() {\n    // Write your solution here\n}\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n    solve();\n    return 0;\n}",
            'java': "import java.util.*;\nimport java.io.*;\n\npublic class Solution {\n    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n        solve(scanner);\n    }\n\n    public static void solve(Scanner scanner) {\n        // Write your solution here\n    }\n}"
        };

        const mimeTypes = {
            'python': 'python',
            'cpp': 'text/x-c++src',
            'java': 'text/x-java'
        };

        function initEditor() {
            const txt = document.getElementById('code-area');
            if (!txt) return;

            // Destroy previous instance if exists (though we normally replace innerHTML)
            // But here we are re-initing.
            if (editorInstance) editorInstance.toTextArea();

            editorInstance = CodeMirror.fromTextArea(txt, {
                mode: 'python',
                theme: 'monokai',
                lineNumbers: true,
                indentUnit: 4,
                matchBrackets: true,
                autoCloseBrackets: true,
                foldGutter: true,
                gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
                extraKeys: { "Ctrl-Space": "autocomplete" }
            });

            // Load saved code or template
            loadCode();

            editorInstance.on('change', () => {
                saveCode();
                showSaveStatus();
            });
        }

        function getProblemId() {
            const hash = window.location.hash.substring(1);
            if (hash.startsWith('problem?id=')) {
                return hash.split('=')[1];
            }
            return null;
        }

        function loadCode() {
            const id = getProblemId();
            if (!id) return;

            const saved = localStorage.getItem(`code_${id}`);
            const savedLang = localStorage.getItem(`lang_${id}`);

            if (savedLang) {
                document.getElementById('lang-select').value = savedLang;
                setEditorMode(savedLang);
            }

            if (saved) {
                editorInstance.setValue(saved);
            } else {
                // Default to Python template
                editorInstance.setValue(languageTemplates['python']);
            }
        }

        function saveCode() {
            const id = getProblemId();
            if (!id) return;
            const code = editorInstance.getValue();
            const lang = document.getElementById('lang-select').value;
            localStorage.setItem(`code_${id}`, code);
            localStorage.setItem(`lang_${id}`, lang);
        }

        function showSaveStatus() {
            const el = document.getElementById('save-status');
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 2000);
        }

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            setEditorMode(lang);
            // Load template for new language
            // Only if user agrees to overwrite? Or maybe just switch?
            // Standard behavior: Switch template if empty or just switch syntax highlighting?
            // Let's prompt or just switch template for now, simpler for MVP.
            // Better: Check if code is default template of previous lang, if so replace.
            // For now, FORCE replace with template to ensure correctness as requested "pre-fill correct boilerplate".
            const confirmReset = confirm("Switching language will reset your current code. Continue?");
            if (confirmReset) {
                editorInstance.setValue(languageTemplates[lang]);
                saveCode();
            } else {
                // Revert select
                const id = getProblemId();
                const savedLang = localStorage.getItem(`lang_${id}`) || 'python';
                document.getElementById('lang-select').value = savedLang;
            }
        }

        function setEditorMode(lang) {
            editorInstance.setOption("mode", mimeTypes[lang]);
        }

        function resetCode() {
            if (confirm("Reset code to default template?")) {
                const lang = document.getElementById('lang-select').value;
                editorInstance.setValue(languageTemplates[lang]);
                saveCode();
            }
        }

        async function runCode() {
            await processSubmission('run');
        }

        async function submitCode() {
            await processSubmission('submit');
        }

        async function processSubmission(mode) {
            const id = getProblemId();
            if (!id) return;

            const code = editorInstance.getValue();
            const lang = document.getElementById('lang-select').value;
            const resDiv = document.getElementById('result-area');

            resDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem_id: id, language: lang, code: code, mode: mode })
                });
                const data = await res.json();

                // Display Logic
                let html = '';
                if (data.status === 'Accepted' || data.status === 'Success') {
                    const color = 'green';
                    html = `
                    <div style="background:#E8F5E9; padding:15px; border-radius:5px; border-left:5px solid ${color};">
                        <h3 style="color:${color}; margin-top:0;">${mode === 'run' ? 'Run Successful' : 'Accepted'}</h3>
                        <p>Passed: ${data.passed_count} / ${data.total_count}</p>
                        ${data.output ? `<pre style="background:rgba(0,0,0,0.05); padding:10px;">Output: ${data.output}</pre>` : ''}
                    </div>`;
                } else {
                    const color = 'red';
                    html = `
                    <div style="background:#FFEBEE; padding:15px; border-radius:5px; border-left:5px solid ${color};">
                        <h3 style="color:${color}; margin-top:0;">${data.status}</h3>
                        <p>Passed: ${data.passed_count} / ${data.total_count}</p>
                        ${data.output ? `<pre style="background:rgba(0,0,0,0.05); padding:10px;">Error/Output: ${data.output}</pre>` : ''}
                        ${data.details ? renderDetails(data.details) : ''}
                    </div>`;
                }
                resDiv.innerHTML = html;

            } catch (e) {
                resDiv.innerText = "Error: " + e.message;
            }
        }

        function renderDetails(details) {
            return details.map(d => `
                <div style="margin-top:10px; font-size:0.9rem; border-top:1px solid #ddd; padding-top:5px;">
                    <strong>Test Case ${d.id}:</strong> <span style="color:${d.status === 'Passed' ? 'green' : 'red'}">${d.status}</span><br>
                    Input: <code>${d.input}</code><br>
                    Expected: <code>${d.expected}</code><br>
                    Actual: <code>${d.actual}</code>
                    ${d.error ? `<br><span style="color:red">Error: ${d.error}</span>` : ''}
                </div>
            `).join('');
        }

        // --- Helpers ---

        function switchTab(e, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));

            e.target.classList.add('active');

            // Activate specific content by id
            const targetContent = document.getElementById(tabId);
            if (targetContent) targetContent.classList.add('active');
        }

        function toggleTheme() {
            const curr = document.documentElement.getAttribute('data-theme');
            const newTheme = curr === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // Init
        init();

    </script>
</body>

</html>
