<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Online Judge</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>

    <!-- Prism for static highlighting in list -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --light: #ecf0f1;
            --bg-body: #f5f6fa;
            --bg-container: white;
            --text-main: #333;
            --text-secondary: #34495e;
            --border: #ddd;
            --item-hover: #f5f5f5;
            --item-bg: #f9f9f9;
            --nav-text: white;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #1a1a1a;
            --secondary: #ecf0f1;
            --accent: #3498db;
            --light: #2c3e50;
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-secondary: #ecf0f1;
            --border: #444;
            --item-hover: #2c2c2c;
            --item-bg: #252525;
            --nav-text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        nav {
            background: var(--primary);
            color: var(--nav-text);
            padding: 0 1rem;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav .logo {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        nav .links {
            display: flex;
            align-items: center;
        }

        nav a {
            color: var(--nav-text);
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-container);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .nested-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nested-menu li {
            margin: 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: background 0.2s;
            user-select: none;
        }

        .menu-item:hover {
            background: var(--item-hover);
            color: var(--accent);
        }

        .menu-item.active {
            background: var(--item-bg);
            color: var(--accent);
            border-left: 3px solid var(--accent);
            font-weight: 600;
        }

        .menu-item .icon {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .menu-item .toggle {
            margin-left: auto;
            font-size: 0.8rem;
            transform: rotate(-90deg);
            transition: transform 0.2s;
        }

        .menu-item.expanded .toggle {
            transform: rotate(0deg);
        }

        .submenu {
            display: none;
            padding-left: 15px;
            background: rgba(0, 0, 0, 0.02);
        }

        .submenu.open {
            display: block;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: var(--bg-container);
            position: relative;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1,
        h2,
        h3 {
            color: var(--text-secondary);
        }

        /* Feature rich styles */
        .problem-header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .description code {
            background: var(--item-bg);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
            border: 1px solid var(--border);
        }

        .description pre {
            background: var(--item-bg);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        .code-editor {
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .CodeMirror {
            height: 500px;
            font-size: 14px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: var(--secondary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-link {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            color: var(--text-secondary);
            opacity: 0.7;
            transition: all 0.2s;
        }

        .tab-link:hover {
            opacity: 1;
            color: var(--accent);
        }

        .tab-link.active {
            border-bottom-color: var(--accent);
            opacity: 1;
            color: var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status Badges */
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-solved {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .badge-unsolved {
            background: #f5f5f5;
            color: #757575;
        }

        /* Modal & Utils */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--bg-container);
            margin: 10% auto;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Document/Theory Layout */
        .theory-doc {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .theory-doc h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .theory-doc h2 {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-top: 40px;
        }

        .theory-doc blockquote {
            border-left: 4px solid var(--accent);
            margin: 0;
            padding-left: 20px;
            color: var(--text-secondary);
            font-style: italic;
            background: var(--item-bg);
            padding: 15px;
            border-radius: 0 5px 5px 0;
        }

        /* Search Box in Sidebar */
        .search-box {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--item-bg);
            color: var(--text-main);
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 id="modal-title" style="margin:0;">Title</h3>
                <span onclick="closeModal()" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <div id="modal-body">
                <input type="text" id="modal-input"
                    style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;">
            </div>
            <div style="text-align:right;">
                <button class="secondary" onclick="closeModal()">Cancel</button>
                <button id="modal-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="logo">
            <i class="fas fa-cube" style="margin-right: 10px; color: var(--accent);"></i>
            AlgoScience
        </div>
        <div class="links">
            <a onclick="navigate('home')">Home</a>
            <a onclick="navigate('calendar')">Calendar</a>
            <a onclick="navigate('editor')">Playground</a>
            <a onclick="navigate('import')">Import/Create</a>
            <a href="/interview" style="color: #ffeb3b;">Mock Interview</a>
            <i class="fas fa-moon" onclick="toggleTheme()" id="theme-icon" style="margin-left: 20px; cursor: pointer;"
                title="Toggle Dark Mode"></i>
        </div>
    </nav>

    <div class="main-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" placeholder="Search problems..." id="sidebar-search" oninput="filterSidebar()">
            </div>
            <div id="sidebar-content">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-area" id="app">
            <!-- Views injected here -->
            <div class="container" style="text-align: center; margin-top: 100px; color: var(--text-secondary);">
                <i class="fas fa-code" style="font-size: 4rem; opacity: 0.2; margin-bottom: 20px;"></i>
                <h2>Select a problem from the sidebar to begin</h2>
            </div>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        let allProblems = [];
        let problemGroups = {};
        let currentSubmissions = [];

        async function init() {
            await loadProblems();
            renderSidebar();

            // Check hash for direct navigation
            const hash = window.location.hash.substring(1); // remove #
            if (hash.startsWith('problem?id=')) {
                const id = hash.split('=')[1];
                renderProblem(id);
            }
        }

        async function loadProblems() {
            try {
                const res = await fetch('/api/problems');
                // Backend returns: { "Group__SubGroup": { "problems": [...], "docs": "..." }, ... }
                const data = await res.json();
                problemGroups = data;
            } catch (e) {
                console.error(e);
            }
        }

        // --- Navigation & Core Views ---

        async function navigate(view) {
            window.location.hash = view; // Update URL hash for history
            if (view === 'home') {
                app.innerHTML = `
                    <div class="container" style="text-align: center; margin-top: 100px; color: var(--text-secondary); animation: fadeIn 0.5s;">
                        <i class="fas fa-code" style="font-size: 4rem; opacity: 0.2; margin-bottom: 20px;"></i>
                        <h2>Select a problem from the sidebar to begin</h2>
                        <p>Or use the Playground to write code freely.</p>
                        <button onclick="navigate('editor')" style="margin-top:20px;">Open Playground</button>
                    </div>`;
            } else if (view === 'editor') {
                renderPlayground();
            } else if (view === 'import') {
                renderImport();
            } else if (view === 'calendar') {
                await renderCalendar();
            }
        }

        // --- Calendar ---
        async function renderCalendar() {
            const today = new Date().toISOString().split('T')[0];
            app.innerHTML = `
                <div class="container animated fadeIn">
                    <div class="problem-header">
                        <h1 style="margin:0;">Calendar</h1>
                        <input type="date" id="cal-date" value="${today}" onchange="loadCalendarTasks()" 
                               style="padding:10px; font-size:1rem; border:1px solid var(--border); border-radius:4px;">
                    </div>
                    
                    <div style="background:var(--bg-container); border:1px solid var(--border); border-radius:8px; padding:20px;">
                        <h3 style="margin-top:0;">Tasks</h3>
                         <div style="display:flex; gap:10px; margin-bottom:20px;">
                            <input type="text" id="new-task" placeholder="Add a new task..." 
                                   style="flex:1; padding:10px; border:1px solid var(--border); border-radius:4px;"
                                   onkeypress="if(event.key === 'Enter') addCalendarTask()">
                            <button onclick="addCalendarTask()"><i class="fas fa-plus"></i> Add</button>
                         </div>
                         <div id="task-list">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                         </div>
                    </div>
                </div>
             `;
            await loadCalendarTasks();
        }

        async function loadCalendarTasks() {
            const date = document.getElementById('cal-date').value;
            const list = document.getElementById('task-list');
            try {
                const res = await fetch(`/api/calendar/${date}`);
                const tasks = await res.json();

                if (tasks.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-secondary); text-align:center;">No tasks for this day.</p>';
                    return;
                }

                list.innerHTML = tasks.map(t => `
                    <div style="display:flex; align-items:center; padding:10px; border-bottom:1px solid var(--border); background:${t.completed ? 'var(--item-bg)' : 'white'}; opacity:${t.completed ? 0.6 : 1};">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id}, this.checked)" style="margin-right:15px; transform:scale(1.2);">
                        <span style="flex:1; text-decoration: ${t.completed ? 'line-through' : 'none'}; font-size:1.05rem;">${t.description}</span>
                        <span style="cursor:pointer; color:red;" onclick="deleteTask(${t.id})"><i class="fas fa-trash"></i></span>
                    </div>
                `).join('');

            } catch (e) {
                list.innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
            }
        }

        async function addCalendarTask() {
            const date = document.getElementById('cal-date').value;
            const input = document.getElementById('new-task');
            const desc = input.value.trim();
            if (!desc) return;

            try {
                await fetch(`/api/calendar/${date}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: desc })
                });
                input.value = '';
                await loadCalendarTasks();
            } catch (e) {
                alert(e.message);
            }
        }

        async function toggleTask(id, completed) {
            const date = document.getElementById('cal-date').value;
            try {
                await fetch(`/api/calendar/${date}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed })
                });
                await loadCalendarTasks();
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteTask(id) {
            if (!confirm("Delete this task?")) return;
            const date = document.getElementById('cal-date').value;
            try {
                await fetch(`/api/calendar/${date}/${id}`, { method: 'DELETE' });
                await loadCalendarTasks();
            } catch (e) {
                console.error(e);
            }
        }

        function renderPlayground() {
            app.innerHTML = `
                <div class="container animated fadeIn">
                   <div class="problem-header">
                        <h1 style="margin:0;">Playground</h1>
                        <span style="color:var(--text-secondary); font-size:0.9rem;">Scratchpad for testing code</span>
                    </div>
                    <div style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                        <div style="display:flex; gap: 10px; align-items:center;">
                           <select id="lang-select" style="padding:5px;" onchange="changeLanguage()">
                               <option value="python">Python 3</option>
                               <option value="cpp">C++</option>
                               <option value="java">Java</option>
                           </select>
                           <button class="secondary" onclick="resetCode('playground')" title="Reset"><i class="fas fa-undo"></i></button>
                        </div>
                        <div>
                           <button class="secondary" onclick="runCode('playground')" style="margin-right:10px;"><i class="fas fa-play"></i> Run Code</button>
                        </div>
                    </div>
                    <div class="code-editor">
                        <textarea id="code-area"></textarea>
                    </div>
                    <div id="result-area" style="margin-top:20px;"></div>
                </div>
                    `;
            // Initialize editor for 'playground' ID
            // We trick existing logical helpers by expecting 'problem?id=playground' sort of context,
            // but actually we just need initEditor to work.
            // We need to override getProblemId or handle 'playground' carefully.

            // Hack for now: Manually init since core logic relies on problem ID for persistence
            initEditorManual('playground');
        }

        function renderImport() {
            app.innerHTML = `
                    <div class="container animated fadeIn" style="max-width: 600px;">
                    <h1>Create New Problem</h1>
                    <div style="background:var(--bg-container); padding:20px; border:1px solid var(--border); border-radius:8px;">
                        
                        <div style="margin-bottom:15px;">
                            <label style="display:block; margin-bottom:5px; font-weight:bold;">Problem Title</label>
                            <input type="text" id="imp-title" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px;" placeholder="e.g. Maximum Subarray Sum">
                        </div>

                        <div style="margin-bottom:15px;">
                            <label style="display:block; margin-bottom:5px; font-weight:bold;">Category (Group/SubGroup)</label>
                            <input type="text" id="imp-category" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px;" placeholder="e.g. Algorithms/Dynamic Programming">
                        </div>

                        <div style="margin-bottom:15px;">
                            <label style="display:block; margin-bottom:5px; font-weight:bold;">Description (Markdown)</label>
                            <textarea id="imp-desc" rows="6" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px;" placeholder="## Problem Statement..."></textarea>
                        </div>

                        <div style="display:flex; gap:20px; margin-bottom:15px;">
                            <div style="flex:1;">
                                <label style="display:block; margin-bottom:5px; font-weight:bold;">Sample Input</label>
                                <textarea id="imp-input" rows="4" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px; font-family:monospace;"></textarea>
                            </div>
                            <div style="flex:1;">
                                <label style="display:block; margin-bottom:5px; font-weight:bold;">Sample Output</label>
                                <textarea id="imp-output" rows="4" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px; font-family:monospace;"></textarea>
                            </div>
                        </div>

                        <button onclick="submitNewProblem()" style="width:100%; padding:10px;">Create Problem</button>
                        <div id="imp-msg" style="margin-top:10px; text-align:center;"></div>
                    </div>

                    <h2 style="margin-top:40px;">Bulk Import</h2>
                    <div style="background:var(--bg-container); padding:20px; border:1px solid var(--border); border-radius:8px;">
                         <p style="font-size:0.9rem; color:var(--text-secondary);">Upload a .zip file containing problem folders.</p>
                         <input type="file" id="bulk-zip" accept=".zip" style="margin-bottom:15px;">
                         <button class="secondary" onclick="submitBulkImport()" style="width:100%; padding:10px;">Import ZIP</button>
                         <div id="bulk-msg" style="margin-top:10px; text-align:center;"></div>
                    </div>
                </div>
                    `;
        }

        async function submitNewProblem() {
            const title = document.getElementById('imp-title').value;
            const category = document.getElementById('imp-category').value;
            const description = document.getElementById('imp-desc').value;
            const input = document.getElementById('imp-input').value;
            const output = document.getElementById('imp-output').value;
            const msg = document.getElementById('imp-msg');

            if (!title || !category) {
                msg.innerHTML = '<span style="color:red">Title and Category are required.</span>';
                return;
            }

            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            try {
                const res = await fetch('/api/problems/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category, description, input, output })
                });
                const data = await res.json();
                if (data.success) {
                    msg.innerHTML = '<span style="color:green">Problem created successfully! Reloading...</span>';
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    msg.innerHTML = `<span style="color:red">Error: ${data.error}</span>`;
                }
            } catch (e) {

        // --- Sidebar Rendering with Nested Support ---

        function renderSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = '<ul class="nested-menu" id="root-menu"></ul>';
            const rootMenu = document.getElementById('root-menu');

            // Logic:
            // We receive keys like "Algorithms__Recursion__Contribution_Technique"
            // We want to transform this into a nested object structure first, then render.

            const tree = {};

            Object.keys(problemGroups).forEach(groupKey => {
                const parts = groupKey.split('__'); // Split by double underscore
                let currentLevel = tree;

                parts.forEach((part, index) => {
                    if (!currentLevel[part]) {
                        currentLevel[part] = {
                            _name: part,
                            _children: {},
                            _problems: [],
                            _docs: null,
                            _fullKey: null
                        };
                    }

                    // If it's the leaf node (the actual group from backend), attach data
                    if (index === parts.length - 1) {
                        currentLevel[part]._problems = problemGroups[groupKey].problems;
                        currentLevel[part]._docs = problemGroups[groupKey].docs;
                        currentLevel[part]._fullKey = groupKey;
                    }
                    currentLevel = currentLevel[part]._children;
                });
            });

            // Recursive renderer
            function buildMenuHtml(node, containerEl) {
                console.log('Building menu for node:', node); // Debug
                const keys = Object.keys(node);
                if (keys.length === 0) return;

                keys.forEach(key => {
                    const item = node[key];
                    const countChildren = Object.keys(item._children).length;
                    const countProblems = item._problems.length;

                    const hasSubFolders = countChildren > 0;
                    const hasProblems = countProblems > 0;

                    // Explicit expansion logic:
                    // Expandable if it has sub-folders OR problems
                    const canExpand = hasSubFolders || hasProblems;

                    console.log(`Item: ${item._name}, SubFolders: ${countChildren}, Problems: ${countProblems}, CanExpand: ${canExpand} `);

                    const li = document.createElement('li');

                    // Folder Header
                    const div = document.createElement('div');
                    div.className = 'menu-item';

                    // Visuals: If it can expand, show folder icon.
                    // If expanded, show open folder.
                    // If it's a leaf specifically (only problems), maybe show a different icon?
                    // For now, keep folder icons.

                    div.innerHTML = `
                    <span class="icon"><i class="fas ${hasSubFolders ? 'fa-folder' : 'fa-folder-open'}"></i></span>
                        ${item._name.replace(/_/g, ' ')} 
                        ${canExpand ? '<span class="toggle"><i class="fas fa-chevron-down"></i></span>' : ''}
                        ${!hasSubFolders && countProblems > 0 ? `<span class="toggle" onclick="event.stopPropagation(); window.open('/api/export/${item._fullKey}')" title="Export Group per ${item._name}" style="transform:none; margin-right:5px;"><i class="fas fa-download"></i></span>` : ''}
                `;

                    // Click behavior
                    div.onclick = (e) => {
                        if (canExpand) {
                            console.log('Toggling:', item._name);
                            div.classList.toggle('expanded');
                            const sub = li.querySelector('.submenu');
                            if (sub) sub.classList.toggle('open');
                        } else {
                            console.log('Cannot expand:', item._name);
                        }
                    };

                    li.appendChild(div);

                    // Container for Children + Problems
                    const subUl = document.createElement('ul');
                    subUl.className = 'submenu nested-menu';

                    // 1. Recursive Children
                    buildMenuHtml(item._children, subUl);

                    // 2. Problems
                    if (hasProblems) {
                        item._problems.forEach(p => {
                            const probLi = document.createElement('li');
                            probLi.innerHTML = `
                    <div class="menu-item" onclick="renderProblem('${p.id}')" style="padding-left: 30px; font-size: 0.9rem;">
                        <span class="icon"><i class="${p.status === 'Solved' ? 'fas fa-check-circle' : 'far fa-circle'}" style="color: ${p.status === 'Solved' ? 'green' : '#ccc'}"></i></span>
                                    ${p.title}
                                </div>
                    `;
                            subUl.appendChild(probLi);
                        });
                    }

                    if (subUl.hasChildNodes()) {
                        li.appendChild(subUl);
                    }

                    containerEl.appendChild(li);
                });
            }

            console.log('Rendering Sidebar v3 (Fix Applied)');
            buildMenuHtml(tree, rootMenu);
        }

        // --- Timer Logic ---
        let timerInterval;
        let timerSeconds = 0;
        let timerRunning = false;

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            stopTimer();
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const h = Math.floor(timerSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((timerSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            const display = document.getElementById('timer-display');
            if (display) display.innerText = `${h}:${m}:${s} `;
        }

        let aiChatHistory = [];

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            addChatMessage('user', message);
            input.value = '';

            // Show loading in history?
            const historyDiv = document.getElementById('chat-history');
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'chat-message model';
            loadingDiv.style.alignSelf = 'flex-start';
            loadingDiv.style.background = '#e1f5fe';
            loadingDiv.style.padding = '8px 12px';
            loadingDiv.style.borderRadius = '10px';
            loadingDiv.style.maxWidth = '80%';
            loadingDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            historyDiv.appendChild(loadingDiv);
            historyDiv.scrollTop = historyDiv.scrollHeight;

            const code = editorInstance.getValue();
            const id = getProblemId();

            try {
                const res = await fetch('/api/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        problem_id: id,
                        history: aiChatHistory,
                        message: message
                    })
                });
                const data = await res.json();

                // Remove loading
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();

                if (data.error) {
                    addChatMessage('model', "Error: " + data.error);
                } else {
                    addChatMessage('model', data.review);
                }

            } catch (e) {
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();
                addChatMessage('model', "Error: " + e.message);
            }
        }

        function addChatMessage(role, text) {
            const historyDiv = document.getElementById('chat-history');
            const div = document.createElement('div');

            // Push to history for next context
            // Note: We don't push the one we just received until confirmed valid? 
            // Actually, for history array we should push pure text.
            // But wait, if we push 'model' response here, we are good.
            // CAUTION: The 'history' for API excludes the CURRENT user message usually, 
            // but we need to track it for the NEXT turn.

            // So: 
            // 1. User sends message -> Add to UI. 
            // 2. Call API (history excludes current msg? No, usually API stateless needs full context or just prev history + new msg).
            // My backend logic: takes `history` (previous) + `message` (new).
            // So we should update `aiChatHistory` AFTER sending? 
            // Actually, if we add User msg to `aiChatHistory` before sending, the backend might double it if logic assumes history IS previous.

            // Let's stick to: Backend takes (history list) + (current message).
            // So we add User message to `aiChatHistory` AFTER successful send? 
            // No, the Backend rebuilds state. 
            // If I send `history`=[A, B] and `message`=C. Backend does start_chat([A, B]) then send(C).
            // Result is [A, B, C, D].
            // So NEXT time, we need [A, B, C, D] in history.

            // So: Add to UI -> Add to `aiChatHistory`? 
            // Wait, "addChatMessage" is for UI. Logic for history storage should be careful.

            // Correct flow:
            // User msg -> UI.
            // Call API (passing current `aiChatHistory` + `message`).
            // Push User msg to `aiChatHistory`.
            // Receive Model response -> UI.
            // Push Model response to `aiChatHistory`.

            // Wait, this function `addChatMessage` is called for both.

            // Implementation:
            aiChatHistory.push({ role: role, parts: [text] });

            div.style.alignSelf = role === 'user' ? 'flex-end' : 'flex-start';
            div.style.background = role === 'user' ? '#dcf8c6' : '#e1f5fe';
            div.style.padding = '8px 12px';
            div.style.borderRadius = '10px';
            div.style.maxWidth = '80%';
            div.style.wordWrap = 'break-word';

            // Render markdown for model
            div.innerHTML = role === 'model' ? marked.parse(text) : text;

            historyDiv.appendChild(div);
            historyDiv.scrollTop = historyDiv.scrollHeight;

            if (role === 'model' && window.Prism) {
                Prism.highlightAllUnder(div);
            }
        }

        // --- Editor & Submission ---
        let editorInstance;

        const languageTemplates = {
            'python': "import sys\n\ndef solve():\n    # Write your solution here\n    pass\n\nif __name__ == '__main__':\n    solve()",
            'cpp': "#include <iostream>\n#include <vector>\n#include <algorithm>\n\nusing namespace std;\n\nvoid solve() {\n    // Write your solution here\n}\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n    solve();\n    return 0;\n}",
            'java': "import java.util.*;\nimport java.io.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n        solve(scanner);\n    }\n\n    public static void solve(Scanner scanner) {\n        // Write your solution here\n    }\n}"

        function initEditor() {
            const txt = document.getElementById('code-area');
            if (!txt) return;

            // Destroy previous instance if exists (though we normally replace innerHTML)
            // But here we are re-initing.
            if (editorInstance) editorInstance.toTextArea();

        function getProblemId() {
            const hash = window.location.hash.substring(1);
            if (hash.startsWith('problem?id=')) {
                return hash.split('=')[1];

            return null;

        function loadCode() {
            const id = getProblemId();
            if (!id) return;

            const savedLang = localStorage.getItem(`lang_${id} `);
            let lang = 'python';

            if (savedLang) {
                document.getElementById('lang-select').value = savedLang;
                setEditorMode(savedLang);
                lang = savedLang;
            }

            const savedCode = localStorage.getItem(`code_${id}_${lang} `);
            if (savedCode) {
                editorInstance.setValue(savedCode);
            } else {
                editorInstance.setValue(languageTemplates[lang]);
            }

        function saveCode() {
            const id = getProblemId();
            if (!id) return;
            const code = editorInstance.getValue();
            const lang = document.getElementById('lang-select').value;
            localStorage.setItem(`code_${id}_${lang} `, code);

        function showSaveStatus() {
            const el = document.getElementById('save-status');

            setTimeout(() => { el.style.opacity = 0; }, 2000);

        function changeLanguage() {
            const newLang = document.getElementById('lang-select').value;

            // 1. Identify old language (difficult without tracking, but we can assume prior state)
            // Actually, we should save BEFORE the value changes, but onchange happens after.
            // Better strategy: We can't save the OLD language code here easily because the select value is already NEW.
            // BUT, we can just load the NEW language code. The 'change' event on editor handles saving continuously.
            // So the previous language's code is ALREADY saved in its specific slot if we used saveCode correctly.
            // Wait, saveCode uses current select value. If select value changed, saveCode would save to NEW slot.
            // We need to be careful. CodeMirror 'change' fires on setValue too.

            // To be safe: loadCode() handles retrieving the correct code for the *current* select value.
            // So we just update mode, save preference, and call loadCode() to refresh content.

            setEditorMode(newLang);
            const id = getProblemId();
            if (id) {
                localStorage.setItem(`lang_${id} `, newLang);
            }

            // Load code for the new language (will get saved or template)
            const savedCode = localStorage.getItem(`code_${id}_${newLang} `);
            if (savedCode) {
                editorInstance.setValue(savedCode);
            } else {
                editorInstance.setValue(languageTemplates[newLang]);
            }
        }

        function setEditorMode(lang) {
            editorInstance.setOption("mode", mimeTypes[lang]);

        async function processSubmission(mode) {
            const id = getProblemId();
            if (!id) return;

            const code = editorInstance.getValue();
            const lang = document.getElementById('lang-select').value;
            const resDiv = document.getElementById('result-area');

            resDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem_id: id, language: lang, code: code, mode: mode })
                });
                const data = await res.json();

                // Display Logic
                let html = '';
                if (data.status === 'Accepted' || data.status === 'Success') {
                    const color = 'green';
                    html = `
                    <div style="background:#E8F5E9; padding:15px; border-radius:5px; border-left:5px solid ${color};">
                        <h3 style="color:${color}; margin-top:0;">${mode === 'run' ? 'Run Successful' : 'Accepted'}</h3>
                        <p>Passed: ${data.passed_count} / ${data.total_count}</p>
                        ${data.output ? `<pre style="background:rgba(0,0,0,0.05); padding:10px;">Output: ${data.output}</pre>` : ''}
                    </div>`;
                } else {
                    const color = 'red';
                    html = `
                    <div style="background:#FFEBEE; padding:15px; border-radius:5px; border-left:5px solid ${color};">
                        <h3 style="color:${color}; margin-top:0;">${data.status}</h3>
                        <p>Passed: ${data.passed_count} / ${data.total_count}</p>
                        ${data.output ? `<pre style="background:rgba(0,0,0,0.05); padding:10px;">Error/Output: ${data.output}</pre>` : ''}
                        ${data.details ? renderDetails(data.details) : ''}
                    </div>`;
                }
                resDiv.innerHTML = html;

            } catch (e) {
                resDiv.innerText = "Error: " + e.message;
            }
        }

        function renderDetails(details) {
            return details.map(d => `
                    <div style="margin-top:10px; font-size:0.9rem; border-top:1px solid #ddd; padding-top:5px;">
                    <strong>Test Case ${d.id}:</strong> <span style="color:${d.status === 'Passed' ? 'green' : 'red'}">${d.status}</span><br>
                    Input: <code>${d.input}</code><br>
                    Expected: <code>${d.expected}</code><br>
                    Actual: <code>${d.actual}</code>
                    ${d.error ? `<br><span style="color:red">Error: ${d.error}</span>` : ''}
                </div>
            `).join('');
        }

        // --- Helpers ---

        function switchTab(e, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));

            e.target.classList.add('active');

            // Activate specific content by id
            const targetContent = document.getElementById(tabId);
            if (targetContent) targetContent.classList.add('active');
        }

        function toggleTheme() {
            const curr = document.documentElement.getAttribute('data-theme');
            const newTheme = curr === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // --- Submission Viewer ---
        function viewSubmission(index) {
            const s = currentSubmissions[index];
            if (!s) return;

            const modal = document.getElementById('custom-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            title.innerText = "Submission Details";

            // Format details
            let content = `
                <div style="margin-bottom:15px; border-bottom:1px solid #ddd; padding-bottom:10px;">
                    <strong>Status:</strong> <span style="color:${s.status === 'Accepted' ? 'green' : 'red'}">${s.status}</span><br>
                    <strong>Language:</strong> ${s.language}<br>
                    <strong>Time:</strong> ${new Date(s.timestamp).toLocaleString()}
                </div>
                <strong>Code:</strong>
                <pre style="background:#f5f5f5; padding:10px; border-radius:4px; max-height:300px; overflow:auto;"><code class="language-${s.language}">${s.code}</code></pre>
            `;

            if (s.output) {
                content += `
                    <strong>Output/Error:</strong>
                    <pre style="background:#fff3e0; padding:10px; border-radius:4px; max-height:150px; overflow:auto;">${s.output}</pre>
                `;
            }

            body.innerHTML = content;
            confirmBtn.style.display = 'none'; // No action needed, just view
            modal.style.display = 'block';

            // Re-highlight if prism is available
            if (typeof Prism !== 'undefined') {
                Prism.highlightAllUnder(body);
            }
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        // Init
        init();

    </script>
</body>

</html>
